name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Habit-tracker.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habit-tracker-apk
          path: app/build/outputs/apk/debug/Habit-tracker.apk
