<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>হিসাব করো</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:"Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#0F1A13}
.app{height:100%;display:flex;flex-direction:column;padding:12px 12px 8px;background:#fff}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:6px}
.dot{width:21px;height:21px;border-radius:7px;background:linear-gradient(140deg,#1E6B3A,#0A2E18);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.brand b{font-size:12.5px;letter-spacing:.2px}
.ghost{border:1px solid #E1EAE2;background:#F7FAF7;color:#14532D;font-size:9.5px;font-weight:700;padding:4px 8px;border-radius:20px;font-family:inherit}
.ghost:active{background:#E8F3EB}
.disp{flex:0 0 auto;border-radius:16px;padding:9px 12px 10px;color:#fff;background:linear-gradient(155deg,#1E6B3A,#14532D 55%,#0A2E18);overflow:hidden}
.expr{font-size:11px;color:#A9C9B4;text-align:right;min-height:15px;white-space:nowrap;overflow:hidden;direction:ltr}
.res{font-size:29px;font-weight:800;text-align:right;line-height:1.2;letter-spacing:.5px;white-space:nowrap;overflow:hidden;direction:ltr}
.prev{font-size:9px;color:#8FB79E;text-align:right;min-height:12px;margin-top:2px;white-space:nowrap;overflow:hidden}
.pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:6px;margin-top:8px}
.k{border:1px solid #E1EAE2;border-radius:12px;background:#F7FAF7;color:#0F1A13;font-size:15px;font-weight:600;font-family:inherit;transition:transform .08s,background .12s}
.k:active{transform:scale(.94);background:#E8F3EB}
.fn{background:#EDF3EE;color:#14532D;font-weight:700;font-size:13px}
.op{background:#E8F3EB;color:#14532D;font-weight:800;font-size:17px;border-color:#D8E8DD}
.eq{grid-column:span 2;border:none;color:#fff;font-size:19px;font-weight:800;background:linear-gradient(140deg,#1E6B3A,#0A2E18)}
.hint{font-size:8.5px;color:#6E7B71;text-align:center;margin-top:6px;letter-spacing:.2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="dot">=</div><b>হিসাব করো</b></div>
    <button class="ghost" onclick="hist()">🕘 ইতিহাস</button>
  </div>
  <div class="disp">
    <div class="expr" id="expr"></div>
    <div class="res" id="res">0</div>
    <div class="prev" id="prev"></div>
  </div>
  <div class="pad" id="pad"></div>
  <div class="hint">বাংলা সংখ্যা • শতাংশ • ইতিহাস</div>
</div>
<script>
var BN='০১২৩৪৫৬৭৮৯';
function bn(s){return String(s).replace(/[0-9]/g,function(d){return BN[+d]});}
var keys=[['AC','fn'],['⌫','fn'],['%','fn'],['÷','op'],
          ['7',''],['8',''],['9',''],['×','op'],
          ['4',''],['5',''],['6',''],['−','op'],
          ['1',''],['2',''],['3',''],['+','op'],
          ['0',''],['.',''],['=','eq']];
var pad=document.getElementById('pad');
keys.forEach(function(k){
  var b=document.createElement('button');
  b.className='k '+k[1];
  b.textContent=k[0];
  b.onclick=function(){press(k[0]);};
  pad.appendChild(b);
});
var expr='123×45';
var last='১২৩ + ৪৫ = ১৬৮';
var resEl=document.getElementById('res'),exprEl=document.getElementById('expr'),prevEl=document.getElementById('prev');
function toMath(s){return s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');}
function compute(s){
  if(!s)return '';
  var t=toMath(s).replace(/%/g,'/100');
  if(!/^[0-9+\-*/. ]+$/.test(t))return '';
  try{var v=Function('"use strict";return ('+t+')')();
    if(!isFinite(v))return '';
    return String(Math.round(v*1e10)/1e10);
  }catch(e){return '';}
}
function render(){
  var r=compute(expr);
  exprEl.textContent=expr?bn(expr):'';
  resEl.textContent=bn(r!==''?r:(expr||'0'));
  prevEl.textContent=last?'আগের: '+last:'';
}
function press(k){
  var ops='+−×÷';
  if(k==='AC'){expr='';}
  else if(k==='⌫'){expr=expr.slice(0,-1);}
  else if(k==='='){
    var r=compute(expr);
    if(r!==''){last=bn(expr)+' = '+bn(r);expr=r;}
  }
  else if(ops.indexOf(k)>=0){
    if(expr===''&&k!=='−')return;
    if(ops.indexOf(expr.slice(-1))>=0)expr=expr.slice(0,-1);
    expr+=k;
  }
  else if(k==='.'){
    var tail=expr.split(/[+−×÷]/).pop();
    if(tail.indexOf('.')>=0)return;
    expr+=k;
  }
  else if(k==='%'){
    if(expr&&ops.indexOf(expr.slice(-1))<0)expr+='%';
  }
  else{expr+=k;}
  render();
}
function hist(){
  last=last||'কোনো হিসাব নেই';
  prevEl.textContent=last;
}
render();
</script>
</body>
</html>
